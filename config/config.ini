# Copy to /data/keyboardsense/config.ini on the console. F9 reloads.
# Unspecified bindings keep their defaults. Names and actions are lowercase.
sensitivity = 1.0
ads_multiplier = 0.6
# Radial anti-deadzone to overcome the game's controller deadzone.
deadzone = 0.08
smoothing_ms = 12
walk_speed = 0.45
invert_y = false

bind.w = up
bind.a = left
bind.s = down
bind.d = right
bind.space = cross
bind.leftctrl = circle
bind.r = square
bind.e = triangle
bind.q = l1
bind.f = r1
bind.leftshift = l3
bind.leftalt = walk
bind.enter = options
bind.tab = touchpad
bind.escape = ps
bind.up = dpad_up
bind.down = dpad_down
bind.left = dpad_left
bind.right = dpad_right
bind.mouse_left = r2
bind.mouse_right = l2
bind.mouse_middle = r3
# 'create' is available for experiments but its ABI bit is unverified.
# Unbind a default with, for example: bind.escape = none
# F9 (reload), F10 (pause/resume), F12 (stop) cannot be rebound.
